# Product-contract assertions for the public documentation site.
#
# The site restates the current product authority in neutral public language. The
# statements below are the ones that are easiest to soften by accident and most
# damaging when softened, so each is pinned to the page that must carry it.
# `tools/check_docs_site.py` reads this file with `tomllib` and fails the build
# when a required literal disappears from its page or a forbidden literal shows
# up anywhere in the site.
#
# A literal is matched after Markdown inline markup (`` ` ``, `*`, `_`, `~`) is
# stripped and whitespace is collapsed, so re-wrapping a paragraph or emphasising
# a word does not break an assertion, while deleting or negating the claim does.

# ---------------------------------------------------------------------------
# Required — page must carry the statement
# ---------------------------------------------------------------------------

[[required]]
page = "index.md"
literal = "Supervise local AGENT runs. Preserve context. Recover with evidence."
reason = "The approved homepage hero, exact."

[[required]]
page = "index.md"
literal = "Agent → Session → Run → Events → Result"
reason = "The homepage trajectory is a static illustration of the product model."

