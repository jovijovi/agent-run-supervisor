# ---------------------------------------------------------------------------
# Forbidden — must not appear in the published site sources
#
# Scope is `website/docs/**` and `website/overrides/**` — the files that become
# the site. This control file is excluded from its own scan, or every pattern
# below would match its own declaration.
#
# Each pattern targets an *affirmative capability claim*, never a word. The site
# has to be able to say "ARS is not a sandbox", "there is no operation that
# closes a Session", and "ARS exposes no public network service": those are the
# contract. A pattern that also banned the refusal would push the page into
# vagueness, which is the failure mode these assertions exist to prevent.
# ---------------------------------------------------------------------------

[[forbidden]]
id = "open-console"
pattern = "(?i)\\bopen console\\b"
reason = "ARS has no web console; there is no console link or button anywhere."

[[forbidden]]
id = "live-run-data"
pattern = "(?i)\\b(?:live|real-?time) (?:run|session) (?:data|feed|dashboard)\\b"
reason = "The site shows no live Run data and is not a dashboard."

[[forbidden]]
id = "sandbox-claim"
pattern = "(?i)\\bARS (?:provides|offers|gives you|is) an? (?:OS )?sandbox\\b"
reason = "ARS makes no sandbox or hostile-code isolation claim."

[[forbidden]]
id = "isolation-guarantee"
pattern = "(?i)\\bARS (?:sandboxes|isolates|contains|confines) the agent\\b"
reason = "Mediation is cooperative; the agent runs with the daemon UID's authority."

[[forbidden]]
id = "public-ingress"
pattern = "(?i)\\b(?:exposes|provides|offers|serves|listens on|binds) (?:a |an )?(?:public|remote|network|tcp|http)\\b"
reason = "Ingress is a local Unix-domain socket only."

[[forbidden]]
id = "session-close-operation"
pattern = "(?i)\\bsession[/_-]close\\b|\\bclose[_-]session\\b"
reason = "No such operation exists on the wire or in the client."

[[forbidden]]
id = "session-close-advice"
pattern = "(?i)\\b(?:you|callers?|clients?|applications?) (?:can|may|should|must) (?:close|end|expire|terminate)\\b[^.]{0,40}\\bsession\\b"
reason = "Sessions have no close or expiry operation to advise callers to use."

[[forbidden]]
id = "session-lifecycle-state"
pattern = "(?i)\\bsession (?:state|status) is (?:open|active|closed|expired)\\b"
reason = "A Session has no open/active/closed state."

[[forbidden]]
id = "credential-management"
pattern = "(?i)\\bARS (?:stores|manages|resolves|refreshes|mints) (?:your )?credentials\\b"
reason = "ARS resolves, mints, refreshes, and stores no credential."

[[forbidden]]
id = "deployment-status"
pattern = "(?i)\\b(?:currently|now) (?:deployed|running in production|live at)\\b"
reason = "The site is documentation, not a deployment-status board."

[[forbidden]]
id = "duplicate-normalized-event-file"
pattern = "(?i)normalized-events\\.jsonl"
reason = "Native ACP persists its normalized stream as events.jsonl; no second file exists."

[[forbidden]]
id = "all-codes-map-to-client-exceptions"
pattern = "(?i)every code above has a generated exception type"
reason = "Only the arsd wire-error set is represented in ERROR_CODE_TO_EXCEPTION."

[[forbidden]]
id = "nonexistent-disabled-publication-workflow"
pattern = "(?i)disabled publication workflow"
reason = "The repository has no dormant publication workflow; activation will be a separate reviewed change."
