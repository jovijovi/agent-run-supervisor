<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Agent Run Supervisor">
  <title>Agent Run Supervisor</title>
  <!-- Recorder housing: a bounded instrument, not a chat bubble. -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.5" fill="none" stroke="#F7F6F2" stroke-width="2"/>
  <!-- Tick scale: the fixed reference the trace is read against. -->
  <g fill="#F7F6F2" opacity=".55">
    <rect x="7" y="7.5" width="1.6" height="3.4" rx=".8"/>
    <rect x="11.6" y="7.5" width="1.6" height="2.2" rx=".8"/>
    <rect x="16.2" y="7.5" width="1.6" height="3.4" rx=".8"/>
    <rect x="20.8" y="7.5" width="1.6" height="2.2" rx=".8"/>
  </g>
  <!-- Trace: one run, recorded. -->
  <path d="M6.5 21.5 L11 21.5 L13.4 15.4 L16.6 24.2 L19.2 18.6 L21.6 18.6"
        fill="none" stroke="#17A6A6" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24.4" cy="18.6" r="2" fill="#D8922B"/>
</svg>
