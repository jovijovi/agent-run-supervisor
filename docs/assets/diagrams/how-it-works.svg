<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="500" viewBox="0 0 1264 500" role="img" aria-labelledby="title desc">
  <title id="title">How Agent Run Supervisor works</title>
  <desc id="desc">A trusted local caller submits over the arsd Unix-domain socket. arsd authenticates the peer and admits the request, ars-core drives one RunTask over Native ACP against a registered external AGENT, and normalized events, supervisor-owned status, and redacted local artifacts come back to the caller.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="arsd" x1="0" x2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{fill:#0f172a;font-weight:700;font-size:21px}
      .subtitle{fill:#64748b;font-size:12.5px}
      .label{fill:#0f172a;font-weight:700;font-size:15px}
      .label-md{fill:#0f172a;font-weight:700;font-size:16px}
      .label-lg{fill:#0f172a;font-weight:700;font-size:18px}
      .sub{fill:#475569;font-size:12.5px}
      .tiny{fill:#64748b;font-size:11px}
      .zone{fill:#0891b2;font-size:11px}
      .flow{fill:#334155;font-weight:600;font-size:11px}
      .note{fill:#334155;font-weight:600;font-size:12px}
    </style>
  </defs>

  <rect x="1" y="1" width="1262" height="498" rx="26" fill="url(#bg)" stroke="#d0d7de"/>

  <text x="632" y="48" text-anchor="middle" class="title">How Agent Run Supervisor works</text>
  <text x="632" y="72" text-anchor="middle" class="subtitle">Primary path — local, unprivileged, one supervised AGENT process per Run</text>

  <!-- ARS boundary -->
  <rect x="267" y="96" width="714" height="172" rx="22" fill="#f7fbff" stroke="#0891b2" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text x="624" y="258" text-anchor="middle" class="zone">Agent Run Supervisor · local, unprivileged, same-user only</text>

  <!-- Forward path -->
  <g filter="url(#shadow)">
    <rect x="37" y="114" width="190" height="124" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="132" y="152" text-anchor="middle" class="label">Trusted caller</text>
    <text x="132" y="180" text-anchor="middle" class="sub">local user application</text>
    <text x="132" y="206" text-anchor="middle" class="tiny">same host · same user</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="287" y="114" width="190" height="124" rx="18" fill="url(#arsd)" stroke="#0891b2" stroke-width="1.5"/>
    <text x="382" y="152" text-anchor="middle" class="label-lg">arsd</text>
    <text x="382" y="180" text-anchor="middle" class="sub">local Unix-domain socket</text>
    <text x="382" y="206" text-anchor="middle" class="tiny">0700 dir · 0600 socket</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="529" y="114" width="190" height="124" rx="18" fill="url(#arsd)" stroke="#0891b2" stroke-width="1.5"/>
    <text x="624" y="152" text-anchor="middle" class="label-md">Peer auth</text>
    <text x="624" y="180" text-anchor="middle" class="sub">admission · ownership</text>
    <text x="624" y="206" text-anchor="middle" class="tiny">SO_PEERCRED · owner-scoped</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="771" y="114" width="190" height="124" rx="18" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="866" y="152" text-anchor="middle" class="label-md">ars-core</text>
    <text x="866" y="180" text-anchor="middle" class="sub">RunTask · Native ACP</text>
    <text x="866" y="206" text-anchor="middle" class="tiny">one process per Run</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1037" y="114" width="190" height="124" rx="18" fill="#fff7ed" stroke="#fb923c"/>
    <text x="1132" y="152" text-anchor="middle" class="label-md">External AGENT</text>
    <text x="1132" y="180" text-anchor="middle" class="sub">registered profile</text>
    <text x="1132" y="206" text-anchor="middle" class="tiny">OpenCode · Codex · Claude</text>
  </g>

  <!-- Return / evidence path -->
  <g filter="url(#shadow)">
    <rect x="731" y="316" width="230" height="104" rx="18" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="846" y="350" text-anchor="middle" class="label">Normalized events</text>
    <text x="846" y="376" text-anchor="middle" class="sub">supervisor-owned status</text>
    <text x="846" y="400" text-anchor="middle" class="tiny">seq-ordered · bounded pages</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1037" y="316" width="190" height="104" rx="18" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="1132" y="350" text-anchor="middle" class="label">Redacted artifacts</text>
    <text x="1132" y="376" text-anchor="middle" class="sub">local evidence store</text>
    <text x="1132" y="400" text-anchor="middle" class="tiny">0700 dirs · 0600 files</text>
  </g>

  <!-- Connections (drawn after every box) -->
  <path d="M227 176 L287 176" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <path d="M477 176 L529 176" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <path d="M719 176 L771 176" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <path d="M961 158 L1037 158" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <path d="M1037 194 L961 194" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowSlate)"/>

  <path d="M866 238 L866 316" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrowGreen)"/>
  <path d="M961 368 L1037 368" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrowGreen)"/>
  <path d="M731 368 L132 368 L132 238" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrowGreen)"/>

  <!-- Connection labels -->
  <text x="257" y="166" text-anchor="middle" class="flow">submit</text>
  <text x="503" y="166" text-anchor="middle" class="flow">verify</text>
  <text x="745" y="166" text-anchor="middle" class="flow">RunSpec</text>
  <text x="999" y="148" text-anchor="middle" class="flow">prompt</text>
  <text x="999" y="212" text-anchor="middle" class="tiny">ACP output</text>
  <text x="854" y="284" text-anchor="end" class="flow">normalize</text>
  <text x="999" y="358" text-anchor="middle" class="flow">written</text>
  <text x="420" y="358" text-anchor="middle" class="flow">run_status · run_events · follow</text>

  <text x="632" y="452" text-anchor="middle" class="note">ARS reports technical supervision status — the caller owns the business verdict (business_verdict = null)</text>
</svg>
