name: Pages Publish

# Publication of the already-validated MkDocs site to GitHub Pages.
# Two triggers, one deployable ref: a push to main republishes the site
# automatically, and workflow_dispatch stays the manual re-run path.
# There is deliberately no path filter: the API reference is generated from
# source docstrings, so a change outside website/ still changes the site.
# Both jobs are guarded to refs/heads/main, so a dispatch from any other ref
# builds nothing and deploys nothing.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# The official artifact-based Pages pattern needs exactly these grants.
# tools/check_docs_site.py holds this file to push-to-main plus
# workflow_dispatch triggering, requires this exact token pin, and refuses
# anything wider.
permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; an in-flight deploy is never cancelled mid-run.
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          enable-cache: true
          python-version: '3.11'
          cache-suffix: docs
          save-cache: false

      - name: Install documentation toolchain
        run: uv sync --locked --extra docs

      - name: Validate public content boundary
        run: uv run python tools/check_docs_site.py

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

      - name: Validate rendered site links
        run: uv run python tools/check_docs_site.py --built-site site --pages-base-path /agent-run-supervisor/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
